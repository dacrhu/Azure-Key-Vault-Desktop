name: Release

on:
  push:
    tags:
      - '*.*.*'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish self-contained
        run: >
          dotnet publish src/AzureKeyVaultDesktop.App
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ env.VERSION }}
          -o publish/${{ matrix.rid }}

      - name: Package (Windows, portable zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath AzureKeyVaultDesktop-${{ matrix.rid }}.zip

      - name: Install installer tooling (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add WixToolset.UI.wixext/5.0.2
          choco install innosetup -y --no-progress

      - name: Package (Windows, MSI)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          wix build packaging/windows/product.wxs
          -arch x64
          -d ProductVersion=${{ env.VERSION }}
          -d PublishDir=${{ github.workspace }}\publish\${{ matrix.rid }}
          -d IconFile=${{ github.workspace }}\src\AzureKeyVaultDesktop.App\Assets\app-icon.ico
          -ext WixToolset.UI.wixext/5.0.2
          -o AzureKeyVaultDesktop-${{ env.VERSION }}.msi

      - name: Package (Windows, EXE installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ env.VERSION }}" `
            "/DPublishDir=${{ github.workspace }}\publish\${{ matrix.rid }}" `
            "/DOutputDir=${{ github.workspace }}" `
            packaging/windows/installer.iss

      - name: Package (macOS, dmg + portable zip)
        if: runner.os == 'macOS'
        run: |
          chmod +x packaging/macos/build-app-bundle.sh
          packaging/macos/build-app-bundle.sh publish/${{ matrix.rid }} AzureKeyVaultDesktop.app "${{ env.VERSION }}"
          hdiutil create -volname "Azure Key Vault Desktop" -srcfolder AzureKeyVaultDesktop.app -ov -format UDZO AzureKeyVaultDesktop-${{ matrix.rid }}.dmg
          ditto -c -k --sequesterRsrc --keepParent AzureKeyVaultDesktop.app AzureKeyVaultDesktop-${{ matrix.rid }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x packaging/linux/build-appimage.sh
          packaging/linux/build-appimage.sh publish/${{ matrix.rid }} AzureKeyVaultDesktop-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: |
            AzureKeyVaultDesktop-*.zip
            AzureKeyVaultDesktop-*.msi
            AzureKeyVaultDesktop-*-Setup.exe
            AzureKeyVaultDesktop-*.dmg
            AzureKeyVaultDesktop-*.AppImage
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/AzureKeyVaultDesktop-*
